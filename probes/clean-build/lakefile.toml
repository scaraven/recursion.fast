# Probe O-4: can Clean be required next to Mathlib v4.34.1 / CompPoly 572f997, and what does its import cone cost?
name = "CleanBuildProbe"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

# Clean sources copied from leanerVM/.lake/packages/Clean (commit 42fe4b26), without .lake/.git.
[[require]]
name = "Clean"
path = "Clean-src"
