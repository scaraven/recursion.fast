# Stage 8 probe: leanerVM's BLAKE2s table (485d0465, 13 modules copied verbatim) through toLayout.
name = "S8Blake2sProbe"
defaultTargets = ["Probe"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

[[require]]
name = "Clean"
path = "../../../ext/Clean"

[[lean_lib]]
name = "LeanerVMBlake2s"
roots = ["LeanerVM.Arithmetization.Tables.Blake2s"]
globs = ["LeanerVM.+"]

[[lean_lib]]
name = "RecursionFastCopy"
roots = ["RecursionFast.Clean.ToLayout"]
globs = ["RecursionFast.+"]
allowNonModules = true

[[lean_lib]]
name = "Probe"
roots = ["Probe", "ProbeFib"]
allowNonModules = true
