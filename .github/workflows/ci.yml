# The core CI of recursion.fast v4 (this repository): the Lean build with Mathlib from its cache,
# the line budget, the axiom audit, the source rule and gate fixtures, the service's tests, the
# sandbox tests, and the harness smoke end to end (BRIEF stage B; V4-A2: the certificate side and the
# benchmark side are separate jobs). A push or a pull request to this repository triggers it; it
# runs no submission. Every check whose subject is organiser code runs here and only here, once per
# harness commit, never in an evaluation (V4-A9): the contract's `acc` before the entry's `V` (the
# organiser's canaries: file parser, trace digest, signature), the service, the sandbox, the badge
# template, the compiled extractor interpreter, the harness. Every job ends within 30 minutes, its
# steps' timeouts nested inside that (V4-A9; the measured step times are in design §3.4).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Q8: every `run:` step is `bash -eo pipefail`, so `cmd | tee log` fails when `cmd` fails
defaults:
  run:
    shell: bash

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: machine
        run: lscpu
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: package tree from the cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Mathlib cache
        run: timeout 300 lake exe cache get
      - name: organiser setup (build, harness tools, allowlist, manifest, external libraries, service)
        run: |
          mkdir -p logs
          # no `Mathlib.Tactic` objects here: the core CI's badges import only the organiser's closure
          RF_BADGE_OBJECTS= timeout 540 harness/org-setup.sh "$PWD"
      - name: line budget (trusted contract <= 500 code lines)
        run: |
          python3 scripts/loc.py RecursionFast/Contract.lean RecursionFast/Contract/*.lean RecursionFast/Contract/Hash/*.lean | tee logs/loc.log
          code=$(awk '/^TOTAL/ {print $5}' logs/loc.log); echo "trusted code lines: $code"; [ "$code" -le 500 ]
      - name: axiom audit
        run: timeout 60 lake env harness/lean-tools/.lake/build/bin/axiomaudit
      - name: hygiene and source rule fixtures
        run: |
          scripts/check-hygiene.sh
          tests/source-rule/check.sh
      - name: source rule token sweep
        run: |
          timeout 60 lake env harness/lean-tools/.lake/build/bin/tokensweep .lake/rf/allowlist.txt > logs/tokens.txt
          python3 -I tests/source-rule/sweep.py scripts/source-rule.py logs/tokens.txt tests/source-rule/reviewed-tokens.txt
      - name: gate fixtures
        run: timeout 90 tests/gate/check.sh
      - name: the service's signatures against the compiled Lean reference signer (V4-A4)
        run: |
          (cd service && timeout 60 cargo build --release --features insecure-test-keys --target-dir target/test-keys)
          timeout 120 lake -f scripts/speed/lakefile.toml build signer extract
          timeout 120 python3 tests/service/test_lean_signer.py .lake/build/bin/signer | tee logs/lean-signer.log
      - name: the compiled extractor interpreter on the witness-sending entry (V4-A9; liveness left the evaluation)
        run: timeout 30 .lake/build/bin/extract | tee logs/extract.log
      - name: acc on a 2^16-query signed trace, timed by the badge (C-m3), and the organiser's canaries (V4-A9)
        run: timeout 120 python3 tests/harness/accprobe/run.py | tee logs/accprobe.log
      - name: chain checker (T_triv,best) at the season shape
        run: |
          timeout 60 python3 -I - <<'PY' | tee logs/chaincheck.log
          import json, os, subprocess, sys
          sys.path.insert(0, "harness")
          from rfh import digest
          starts = [os.urandom(32) for _ in range(64)]
          root = digest.tree_root(digest.leaf_digests(starts, 1 << 18))
          json.dump({"n": 1 << 18, "starts": [s.hex() for s in starts]}, open("logs/leaves.json", "w"))
          core = str(max(os.sched_getaffinity(0)))
          for _ in range(3):
              print(subprocess.run(["taskset", "-c", core, "harness/lean-tools/.lake/build/bin/chaincheck", "logs/leaves.json",
                                    root.hex()], capture_output=True, text=True).stdout.strip())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lean-logs, path: logs/ }

  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: machine
        run: lscpu
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: build and unit tests (toolchain pinned by service/rust-toolchain.toml)
        working-directory: service
        run: |
          timeout 300 cargo build --release
          timeout 300 cargo build --release --features insecure-test-keys --target-dir target/test-keys
          timeout 120 cargo test --release
      - name: service tests (hashlib, the reference WOTS signer, caps, exhaustion)
        run: timeout 300 python3 tests/service/test_service.py
      - name: service measurements on this runner
        run: timeout 300 tests/service/measure.sh 4 | tee service-measure.log
      - uses: actions/upload-artifact@v4
        with: { name: service-measure, path: service-measure.log }

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: machine
        run: lscpu
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: committed assembly assembles with this image's toolchain (RF-M2)
        run: |
          gcc --version | head -1; as --version | head -1; ldd --version | head -1
          for s in $(git ls-files '*.s'); do gcc -c -o /dev/null "$s" && echo "assembles: $s"; done
      - name: runner setup (AppArmor user namespaces, bubblewrap, systemd user scopes)
        run: harness/ci/runner-setup.sh
      - name: service
        working-directory: service
        run: timeout 300 cargo build --release
      - name: sandbox tests (hostile prover; the clock stops when the sandbox is dead, V4-A11 §5.1; R-M1)
        run: timeout 300 python3 tests/harness/test_sandbox.py
      - name: the verifier term, the score, the draws and the fit (V4-A11 §3, §4, §11)
        run: timeout 60 python3 tests/harness/test_tv.py
      - name: the stream's control flow, re-timing and truncation (V4-A11 §2, §5.3, §6, R-M2)
        run: timeout 60 python3 tests/harness/test_stream.py
      - name: a part past PART_S after the prover's build started is the entry's REJECT (review M-3)
        run: timeout 120 python3 tests/harness/test_partcap.py
      - name: the aggregation requires every planned part (two jobs, single runs), and the DoS column fails on time and crashes only (RF-M1, V4-A9)
        run: |
          timeout 60 python3 tests/harness/test_aggregate.py
          timeout 60 python3 tests/harness/test_dos.py
      - name: harness smoke with the stand-in badge (runner, service, toy prover, broken provers)
        run: timeout 600 python3 tests/harness/smoke.py --mock --work "$RUNNER_TEMP/smoke-mock"

  smoke:
    # the end-to-end smoke with the real badge: the library's witness-sending entry, certified by the
    # certificate job, benchmarked by the toy assembly prover. It builds the organiser itself, so it
    # runs beside `lean` rather than after it (the critical path: `harness` then `smoke`)
    needs: [harness]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: machine
        run: lscpu
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: committed assembly assembles with this image's toolchain (RF-M2)
        run: |
          gcc --version | head -1; as --version | head -1; ldd --version | head -1
          for s in $(git ls-files '*.s'); do gcc -c -o /dev/null "$s" && echo "assembles: $s"; done
      - name: runner setup
        run: harness/ci/runner-setup.sh
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - run: timeout 300 lake exe cache get
      - run: mkdir -p logs && RF_BADGE_OBJECTS= timeout 540 harness/org-setup.sh "$PWD"
      - name: comparator and lean4export (pinned in scripts/tools.env)
        run: timeout 240 harness/ci/build-kernels.sh "$RUNNER_TEMP/kernels" >> "$GITHUB_ENV"
      - name: end-to-end smoke (certificate with the Lean kernel, accF badge, benchmark, organiser canaries, broken provers, provisional, source rule)
        run: timeout 480 python3 tests/harness/smoke.py --org "$PWD" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: "${{ runner.temp }}/smoke/*.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-logs, path: logs/ }
