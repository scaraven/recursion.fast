# The evaluation of one entry (reusable; TRUSTED). The submissions repository calls it from an
# organiser-controlled workflow (harness/ci-template/evaluate-entry.yml), pinned to a commit of this
# repository, with the entry's commit SHA and root. V4-A1, V4-A2:
#
#   certificate  source rule, comparator (Lean kernel; nanoda if `nanoda`), gate, badge build;
#                deterministic; untrusted code runs only inside the sandbox
#   benchmark    the GitHub-hosted runner: prover build, setup, T run, stream, liveness, DoS, score;
#                untrusted code runs only inside the sandbox. A GitHub-hosted job ends after 6 h, and
#                three tree repeats plus three stream repeats of the season shape do not fit one job:
#                with `split` (the default) the benchmark is six jobs, (1) calibration, one tree
#                repeat, the DoS column and liveness, (2)-(3) one tree repeat each, (4)-(6) one stream
#                repeat each. Every job builds the prover, runs its own service lifetimes, measures its
#                own `T_triv,best` and service throughput on its own machine, and checks its outputs
#                against that calibration; `harness/aggregate.py` then takes `T_tree` as the median of
#                the three tree repeats and `t_link` as the median of the three stream repeats, lists
#                each job's CPU model, and marks a result whose jobs ran on different CPU models
#                (`mixed_cpu`) as not usable for a paired record comparison. `split: false` runs
#                everything in one job (the smoke shape).
#   attest       signs the result JSON with a GitHub artifact attestation; runs no entry code
#
# Nothing here holds a write token while entry code runs: `permissions` are read-only in the
# certificate and benchmark jobs, checkouts do not persist credentials, the entry is fetched by SHA
# as data with plain git, and every sandboxed process starts with an empty environment.
#
# Record acceptance (V4-A1): a result is a record only if
#   gh attestation verify result.json --owner scaraven \
#      --signer-workflow scaraven/recursion.fast/.github/workflows/evaluate.yml
# passes; the attested JSON binds the verdict to vk, the CPU model, the runner image, the harness
# commit and the service binary's hash.
name: evaluate
on:
  workflow_call:
    inputs:
      entry_repo: { type: string, required: true, description: "owner/name of the repository holding the entry" }
      entry_sha: { type: string, required: true, description: "the commit to evaluate (full SHA)" }
      entry_path: { type: string, required: true, description: "the entry's root in that commit" }
      pr_ref: { type: string, required: false, default: "", description: "refs/pull/N/head, fetched from entry_repo" }
      core_ref: { type: string, required: true, description: "the commit of scaraven/recursion.fast to use (the caller's pin)" }
      season: { type: string, required: false, default: "harness/season.toml" }
      nanoda: { type: boolean, required: false, default: false }
      split: { type: boolean, required: false, default: true }
    outputs:
      verdict: { value: "${{ jobs.attest.outputs.verdict }}" }
permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: { contents: read }
    outputs:
      status: ${{ steps.cert.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: scaraven/recursion.fast, ref: "${{ inputs.core_ref }}", path: core, persist-credentials: false }
      - name: runner setup
        run: core/harness/ci/runner-setup.sh
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: core/.lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('core/lean-toolchain', 'core/lake-manifest.json') }}
      - name: organiser setup (before any entry code is on the machine)
        working-directory: core
        run: |
          timeout 3600 lake exe cache get
          mkdir -p logs && timeout 14400 harness/org-setup.sh "$PWD"
      - name: proof checkers
        env: { RF_NANODA: "${{ inputs.nanoda && '1' || '0' }}" }
        run: timeout 5400 core/harness/ci/build-kernels.sh "$RUNNER_TEMP/kernels" >> "$GITHUB_ENV"
      - name: fetch the entry by SHA (data only; never executed outside the sandbox)
        env: { REPO: "${{ inputs.entry_repo }}", SHA: "${{ inputs.entry_sha }}", P: "${{ inputs.entry_path }}", REF: "${{ inputs.pr_ref }}" }
        run: core/harness/ci/fetch-entry.sh "$REPO" "$SHA" "$P" "$REF" entry
      - name: certificate (source rule, comparator, gate, badge)
        id: cert
        run: |
          python3 -I core/harness/evaluate.py cert --entry entry --org "$PWD/core" --work "$RUNNER_TEMP/cert" \
            --out cert.json ${{ inputs.nanoda && '--nanoda' || '' }} || true
          echo "status=$(python3 -I -c 'import json; print(json.load(open("cert.json"))["status"])')" >> "$GITHUB_OUTPUT"
          mkdir -p cert-out && cp cert.json cert-out/ && cp -r "$RUNNER_TEMP/cert/badge" cert-out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: certificate, path: cert-out/ }

  benchmark:
    needs: certificate
    if: needs.certificate.outputs.status != 'reject'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: { contents: read }
    strategy:
      fail-fast: true
      matrix:
        # every job calibrates T_V and the service on its own machine (V4-12, V4-A5)
        part: ${{ fromJSON(inputs.split && '["calibrate,tree,dos,liveness", "calibrate,tree", "calibrate,tree", "calibrate,stream", "calibrate,stream", "calibrate,stream"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: scaraven/recursion.fast, ref: "${{ inputs.core_ref }}", path: core, persist-credentials: false }
      - name: runner setup
        run: core/harness/ci/runner-setup.sh
      - name: service
        working-directory: core/service
        run: timeout 1800 cargo build --release
      - uses: actions/download-artifact@v4
        with: { name: certificate, path: cert }
      - name: fetch the entry by SHA
        env: { REPO: "${{ inputs.entry_repo }}", SHA: "${{ inputs.entry_sha }}", P: "${{ inputs.entry_path }}", REF: "${{ inputs.pr_ref }}" }
        run: core/harness/ci/fetch-entry.sh "$REPO" "$SHA" "$P" "$REF" entry
      - name: benchmark
        env: { PART: "${{ matrix.part }}", RF_HARNESS_COMMIT: "${{ inputs.core_ref }}" }
        run: |
          chmod +x cert/badge/*
          python3 -I - <<'EOF'
          import json; c = json.load(open("cert/cert.json")); c["badge_dir"] = "cert/badge"; json.dump(c, open("cert/cert.json", "w"))
          EOF
          args=(); [[ "$PART" == all ]] || args=(--parts "$PART" --tree-repeats 1 --stream-repeats 1)
          python3 -I core/harness/evaluate.py bench --entry entry --cert cert/cert.json --work "$RUNNER_TEMP/bench" \
            --season "core/${{ inputs.season }}" --out "result-${{ strategy.job-index }}.json" "${args[@]}" || true
      - uses: actions/upload-artifact@v4
        with: { name: "result-${{ strategy.job-index }}", path: "result-*.json" }

  attest:
    needs: [certificate, benchmark]
    if: always() && needs.certificate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read, id-token: write, attestations: write }
    outputs:
      verdict: ${{ steps.agg.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: scaraven/recursion.fast, ref: "${{ inputs.core_ref }}", path: core, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { pattern: "result-*", path: parts, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: certificate, path: cert }
      - name: aggregate (data only; no entry code runs in this job)
        id: agg
        env: { SEASON: "core/${{ inputs.season }}", RUN: "${{ github.run_id }}", ATTEMPT: "${{ github.run_attempt }}" }
        run: |
          python3 -I core/harness/aggregate.py --season "$SEASON" --cert cert/cert.json --out result.json \
            --job "$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT" parts/result-*.json
          echo "verdict=$(python3 -I -c 'import json; print(json.load(open("result.json"))["verdict"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: result.json }
      - uses: actions/upload-artifact@v4
        with: { name: result, path: result.json }
