# recursion.fast v3: the trusted core of a Lean-checked autoresearch competition (a non-interactive
# argument in the random-oracle model over digest statements; whole-tree wall time). Design:
# docs/DESIGN-v3.md. Entries, the baseline first, live in the submissions repository
# (https://github.com/scaraven/recursion.fast-submissions), never here.
# Pins: Lean v4.34.1, Mathlib v4.34.1, ArkLib 7653a90, CompPoly 572f997, VCVio a4232d0,
# PolyFun 41d3b21. The v2 tree (contract, harness, probes, baseline) is in git history at the tag
# `v2-archive`; its lake targets are gone with it (DESIGN-AMENDMENTS V3-S1-A27).
name = "RecursionFast"
defaultTargets = ["RecursionFastContract", "RecursionFastLibrary", "RecursionFastControls"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

# Pinned, untrusted dependencies of the organiser's library (the contract imports Lean core,
# Mathlib and the vendored Rv64 only). No v3 module imports them yet: the baseline's field
# (CompPoly's BF64, DESIGN-v3 §7.4) and the ArkLib bridge (stage S4) will. Kept pinned so the
# manifest and the shared package tree do not change.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "7653a901ed466c88a2e61a3075011b73d7bb2316"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "a4232d084aa18aa71f75b92b64082b457ffdb77b"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

# riscv-zkvm `Rv64` hand model, vendored byte-identically from 6810fc1 (scripts/check-vendor.sh).
# TRUSTED (the extractor's machine), not counted in the contract's own line budget.
[[lean_lib]]
name = "RiscvZkvm"
srcDir = "RecursionFast/Vendor"
roots = ["RiscvZkvm"]
globs = ["RiscvZkvm.+"]
moreLeanArgs = ["--tstack=400000"]

# TRUSTED contract (Lean core + Mathlib + vendored Rv64 only).
[[lean_lib]]
name = "RecursionFastContract"
roots = ["RecursionFast.Contract"]
globs = ["RecursionFast.Contract.*"]

# UNTRUSTED, kernel-checked organiser library.
[[lean_lib]]
name = "RecursionFastLibrary"
roots = ["RecursionFast.Library"]
globs = ["RecursionFast.Library.*"]

# Kernel-checked positive / negative controls (CI).
[[lean_lib]]
name = "RecursionFastControls"
roots = ["RecursionFast.Controls"]
globs = ["RecursionFast.Controls.*"]

# Harness tools (trusted, Lean core only): the environment-level gate and the axiom audit. The
# gate's allowlist, the olean manifest, the organiser build, the challenge stubs and the renderer
# are rebuilt for v3 by stage S3 (DESIGN-v3 §11).
[[lean_exe]]
name = "gate"
srcDir = "scripts"
root = "Gate"
supportInterpreter = true

[[lean_exe]]
name = "axiomaudit"
srcDir = "scripts"
root = "AxiomAudit"
supportInterpreter = true
