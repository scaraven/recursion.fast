# recursion.fast, ideation phase: the Lean library is an empty skeleton while the next design is
# worked out in docs/. The v3 contract, library, controls and harness tools are on the branch
# `v3/contract-archive`; v2 is at the tag `v2-archive`.
name = "RecursionFast"
defaultTargets = ["RecursionFast"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The [[require]] blocks below and lake-manifest.json are kept unchanged on purpose: they are the
# pinned toolchain for the next design (Lean v4.34.1, Mathlib v4.34.1, CompPoly 572f997, ArkLib
# 7653a90, VCVio a4232d0, PolyFun 41d3b21). Changing them would need `lake update`, which must
# never run against the shared, prebuilt package tree that .lake/packages points to. Nothing
# imports them yet.
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "7653a901ed466c88a2e61a3075011b73d7bb2316"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "a4232d084aa18aa71f75b92b64082b457ffdb77b"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

[[lean_lib]]
name = "RecursionFast"
roots = ["RecursionFast"]
