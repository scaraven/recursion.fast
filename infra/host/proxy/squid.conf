# The VMs' only way out (installed as /etc/squid/squid.conf by host-setup.sh). An allowlisting
# forward proxy: it listens only on the host's ends of the VM taps, accepts only the VM subnet,
# serves only HTTPS CONNECT to port 443 of the hosts in rf-allowlist*.txt (the build VM also plain
# HTTP and the hosts of rf-allowlist-build.txt), caches nothing and logs every request.
http_port 10.77.1.1:3128
http_port 10.77.2.1:3128
http_port 10.77.3.1:3128
http_port 10.77.9.1:3128

acl vms src 10.77.0.0/16
acl build src 10.77.9.0/30
acl https_port port 443
acl web_ports port 80 443
acl CONNECT method CONNECT
acl allowed dstdomain -n "/etc/squid/rf-allowlist.txt"
acl allowed_re dstdom_regex -n -i "/etc/squid/rf-allowlist-regex.txt"
acl allowed_build dstdomain -n "/etc/squid/rf-allowlist-build.txt"

http_access deny !vms
http_access allow build CONNECT https_port allowed
http_access allow build CONNECT https_port allowed_build
http_access allow build !CONNECT web_ports allowed_build
http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed
http_access allow allowed_re
http_access deny all

# per client: at most 256 open connections
client_ip_max_connections 256
cache deny all
cache_mem 16 MB
forwarded_for delete
via off
httpd_suppress_version_string on
access_log daemon:/var/log/squid/access.log squid
coredump_dir /var/spool/squid
shutdown_lifetime 5 seconds
# no ICMP probes to destinations on the VMs' behalf
pinger_enable off
