# recursion.fast, season 1: every shape and cap of an evaluation (AGENTS.md §6, §7, §9). The runner
# reads nothing else; `smoke.toml` is the CI smoke's copy at a small shape.
# Job limits are in .github/workflows/evaluate.yml (AGENTS.md §9): the certificate job 50 minutes, the benchmark
# job 70 minutes, every other job at most 30. The caps below are nested inside those limits, so no
# job is killed: a request, build or setup over its cap is the entry's REJECT with the reason, and
# so is a benchmark that reaches stream_s (a slow or hung check included).
name = "season-1"

[score]           # AGENTS.md §7: seconds, lower is better, each track pricing its own proofs:
                  # P_total = the median of the timed_runs pass totals T_t = Σ_i P_{i,t};
                  # S = P_total · 2^(|π_M| / size_ref) (`final`),
                  # S_every = P_total · 2^(max_i |π_i| / size_ref) (`every`)
size_ref = 524288 # 512 KiB: `final` multiplies P_total by 2^(|π_M| / size_ref), `every` by
                  # 2^(max_i |π_i| / size_ref) (×1.41 at 256 KiB, ×2 at final_pi_cap; up to ×4 in
                  # `every`, whose intermediate proofs may reach pi_cap); no verifier time is scored

[certificate]     # the certificate job's Lean steps, on the evaluation VM; a breach is the
                  # entry's REJECT, except the kernel's, which leaves the certificate unchecked
build_s = 1200    # the entry's `lake build` of the challenge and Solution's import closure
kernel_s = 600    # the comparator: the exports and the Lean kernel's replay
gate_s = 120      # the gate
badge_s = 180     # the badge build
render_s = 30     # the challenge rendered from claim.json (≤ claim_bytes)
source_rule_s = 120   # the source rule on lean/ (≤ lean_bytes; 8.9 MB took 10 s on an organiser
                      # workstation)

[entry]           # the entry root as data, checked before the source rule (so a huge unused file
                  # cannot force a timeout); a breach is the entry's REJECT. A large recursive
                  # entry measured: lean/ 263 files, 8.9 MB, largest 145 kB; prover/ 44 files,
                  # 58.6 MB, prover.s 35.1 MB; the whole root 67.5 MB
files = 2048              # every regular file of the root
bytes = 536870912         # 512 MiB, the whole root
file_bytes = 134217728    # 128 MiB, any one file
lean_files = 1024         # lean/ (all files, any depth)
lean_bytes = 33554432     # 32 MiB: the source rule's input (8.9 MB took 10 s on an organiser
                          # workstation)
prover_files = 256        # prover/
prover_bytes = 268435456  # 256 MiB
claim_bytes = 65536       # claim.json, the renderer's input

[stream]          # the one IVC stream (AGENTS.md §6): PROVER first, then PROVER step, a fresh
                  # process each, run once against the service (the service run, untimed), then
                  # timed_runs times against its replay (the timed passes)
M = 16            # steps per stream: one published constant, the same for every entry
n = 262144        # 2^18 blocks of 32 bytes per step (leafCap = 2^20): every step proves one leaf
                  # over its data xs_i (leaf.bin, 8 MiB), L_i = leafStmt (dataRoot xs_i) n, dataRoot a
                  # Keccak-256 Merkle root (2^18 block hashes and 2^18 − 1 tree nodes, about 2^19
                  # permutations); c_1 = L_1, c_i = nodeStmt c_{i-1} L_i. The data is the SHAKE-256
                  # expansion of a fresh secret seed s_i per step and evaluation, published after it
ready_s = 10      # seconds from a request's process start to its `ready` line
step_s = 20       # seconds per request from its inputs to the death of its last process
stream_s = 2000   # seconds of the entry's time for the whole benchmark from its first calibration
                  # sample (rfh.bench.Bench.deadline): every request's start-up and timed part and
                  # every badge run (the service run, its checks and canaries, the timed passes; no
                  # check has a cap of its own); reaching it is the entry's REJECT. The runner's own
                  # work (copies, scrubs, samples, views, staging, the untimed delays) is off this
                  # clock, recorded as stream.clock and bounded by the job's PART_S (AGENTS.md §9).
                  # 64 requests (16 + 3 × 16) × (ready_s + step_s) = 1,920 s, plus the badge runs:
                  # the per-request caps bind first except when an entry uses nearly every cap at
                  # once. The timed passes repeat the service run's requests, so about 4 × the
                  # stream's proving time is needed. A later season may set another value.
check_every = 8   # with M = 16: outputs 1–8 checked between steps 8 and 9, 9–15 after step 16, the
                  # final output after them (no entry process alive during a check); every output
                  # is judged on its own, in three badge runs that check nothing else (45 runs for
                  # the 15 intermediate outputs, 3 for the final one)
timed_runs = 3    # AGENTS.md §6: timed passes after the service run, each output byte-identical to the
                  # service run's; P_total = the median of the three pass totals (rfh.bench.score);
                  # must be odd

[calibration]     # AGENTS.md §6: interleaved samples with no entry process alive, medians used
every = 8         # samples before the service run's steps 1 and 9, one before each timed pass and a
                  # closing one if 30 s of stream_s remain: about 6 samples
idle_s = 2.0      # the idle gap before a sample (1 s left residual load)
rounds = 32       # the work of one `calib` run (harness/tools/calib.c)
runs_per_sample = 3     # a sample is the median of this many short runs
ref_ns = 316200000      # AGENTS.md §6: `calib`'s time (32 rounds, its Keccak workload, the job's 8
                        # threads) on the evaluation machine, the median of 30 samples; c_P =
                        # median(samples) / ref_ns is a health check, never in the score
ref_provisional = false # ref_ns is measured: c_P's drift is enforced
c_P_drift = 0.065       # AGENTS.md §6: |c_P - 1| above it is an organiser ERROR (the machine is not
                        # in its calibrated state); about 4 standard deviations of one c_P sample at
                        # the higher measured spread on the evaluation machine (1.55 %), far more of
                        # the median that is judged
service_s = 2           # seconds per service throughput measurement (published, not scored)

[caps]            # AGENTS.md §6, §7: the size and verifier caps (acc itself only requires |π| to fit a
                  # word); a breach of a final cap, and of pi_cap at any step, is the entry's REJECT,
                  # of an intermediate output's v_cap its exclusion from the track `every`
pi_cap = 1048576        # 1 MiB: every output, its |π| if it parses as a signed proof that acc accepts,
                        # else its file size (a breach is the entry's REJECT, whichever step)
final_pi_cap = 524288   # 512 KiB: the final output's |π| (both tracks)
badge_start_s = 2       # a warmed badge process, from its release to the answer to the organiser's warm-up
                        # input (start-up included: an entry's top-level constants are evaluated then,
                        # untimed); measured about 0.08 s; a breach is a failed check (the final
                        # output's: REJECT; an intermediate one's: the track `every`)
v_cap_ms = 64           # one acc check of a checked proof (file read and parse included), one pinned
                        # core, timed by the runner around the request and by the badge, the larger
                        # counts; a checked proof is judged in three separate fresh badge runs (each
                        # warmed on an organiser input, checking it alone) and the median of its three
                        # times counts (a judged run of an intermediate output is bounded by
                        # 60 s + 4 v_cap, a canary run of c canaries by 60 s + 2 (c + 1) v_cap)
file_cap = 67108864     # a signed-proof file the runner reads: ≤ 64 MiB
setup_s = 240           # `prover setup` (untimed)
setup_cap = 4294967296  # the setup directory with the prover binary after `prover setup`: ≤ 4 GiB (and
                        # ≤ 2^16 entries); copied to the runner's tmpfs
                        # afresh for the service run and each timed pass (one copy at a time), resident
                        # while its pass runs, charged to the runner ([memory])
work_cap = 4294967296   # a request's /work when its prover is dead: ≤ 4 GiB, sparse files at their size
build_s = 120           # the prover's build

[memory]          # cgroup caps (10 GiB for prover and service together; the VM has 16 GB). Resident at
                  # once while a prover runs: its 8 GiB, the setup's copy on the runner's tmpfs (up to
                  # setup_cap = 4 GiB, charged to the runner, not reclaimable without swap) and the
                  # service's 2 GiB: 14 GiB of caps, about 1.5 GiB left for the kernel and the runner
                  # on 16 GiB (AGENTS.md §9); the badge's 4 GiB is never used while a prover runs
prover = "8G"
service = "2G"
badge = "4G"

[machine]         # AGENTS.md §6: a benchmark on another machine (or with no readable fingerprint)
                  # is an organiser ERROR. The sha256 of the canonical JSON (sort_keys, separators
                  # "," ":") of the required fields cpu_model, vm_shape {vcpus, memory},
                  # frequency_policy, image_id of the file at RF_MACHINE_FINGERPRINT that the
                  # evaluation VM provides (rfh.bench.fingerprint); only the hash is published
                  # (host_kernel is recorded, not hashed; microcode is not published)
fingerprint = "d28ff4798f3900a304361e62239bd35575a8b73920dcdb03d97079bde2599927"   # the bench VM on image 9339a3c3…; a new image changes it
