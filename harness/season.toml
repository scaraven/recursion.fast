# recursion.fast, season 1: every shape and cap of an evaluation (AGENTS.md §6, §7, §9). The runner
# reads nothing else; `smoke.toml` is the CI smoke's copy at a small shape.
# Job limits are in .github/workflows/evaluate.yml (AGENTS.md §9): the certificate job 50 minutes, the benchmark
# job 50 minutes, every other job at most 30. The caps below are nested inside those limits: an entry that is slow or hangs fails a cap and is REJECTed with the
# reason, never killed with its job.
name = "season-1"

[score]           # S = P̄ + V̄ (AGENTS.md §7); seconds per 2^18-permutation step
K = 1.5           # the verifier term's weight; kappa = K · v0 is what the score uses
kappa = 0.9893    # seconds per unit of max(x, x^3): K · v0, v0 = 659.5 ms, the v_ref (T_triv / R)
                  # measured on the evaluation machine
n_ref = 262144    # 2^18: P̄ is per n_ref permutations (a chain step is one Keccak-f[1600])
s_ref = 2097152   # 2 MiB: x_i = V_i / v_ref + |π_i| / s_ref
R = 10            # v_ref = T_triv / R (a knee of the score, not a gate)

[certificate]     # the certificate job's Lean steps, on the evaluation VM; a breach is the
                  # entry's REJECT, except the kernel's, which leaves the certificate unchecked
build_s = 1200    # the entry's `lake build` of the challenge and Solution's import closure
kernel_s = 600    # the comparator: the exports and the Lean kernel's replay
gate_s = 120      # the gate
badge_s = 180     # the badge build
render_s = 30     # the challenge rendered from claim.json (≤ claim_bytes)
source_rule_s = 120   # the source rule on lean/ (≤ lean_bytes; 8.9 MB took 10 s on an organiser
                      # workstation)

[entry]           # the entry root as data, checked before the source rule (so a huge unused file
                  # cannot force a timeout); a breach is the entry's REJECT. A large recursive
                  # entry measured: lean/ 263 files, 8.9 MB, largest 145 kB; prover/ 44 files,
                  # 58.6 MB, prover.s 35.1 MB; the whole root 67.5 MB
files = 2048              # every regular file of the root
bytes = 536870912         # 512 MiB, the whole root
file_bytes = 134217728    # 128 MiB, any one file
lean_files = 1024         # lean/ (all files, any depth)
lean_bytes = 33554432     # 32 MiB: the source rule's input (8.9 MB took 10 s on an organiser
                          # workstation)
prover_files = 256        # prover/
prover_bytes = 268435456  # 256 MiB
claim_bytes = 65536       # claim.json, the renderer's input

[stream]          # the one IVC stream (AGENTS.md §6): PROVER first, then PROVER step, a fresh
                  # process each
M = 96            # steps per stream: one published constant, the same for every entry
n_lo = 131072     # every chain length is in [n_lo, n_hi] = [2^17, 2^20] (the lengths are below)
n_hi = 1048576    # the season's range; a later season may set another
ready_s = 10      # seconds from a request's process start to its `ready` line
step_s = 60       # seconds per request from its inputs to the death of its last process
stream_s = 1920   # wall seconds for the whole stream from its first calibration sample: every
                  # request, check, canary, calibration sample and re-run; a later season may set
                  # another
check_every = 8   # outputs checked in batches of this many, between steps (no entry process alive)
retime_factor = 1.3   # AGENTS.md §6: a step above 1.3 × the fit's prediction is run once more ...
retime_frac = 0.1     # ... at most 10% of the steps, largest ratio first
# The chain lengths: one fixed, published sequence, the same for every evaluation, every entry and every
# core commit until the owner changes it (the chain starts are fresh secret draws per evaluation). M + 1
# values: step 1's two chains, then one per step. Derived once, with no choice of seed and no draw
# discarded (rfh.draws.published_lengths; tests/harness/test_tv.py re-derives and checks it): for
# k = 0 … M, u_k = (the first 8 bytes of SHA-256("recursion.fast chain lengths" ‖ k as 8 bytes
# big-endian), big-endian, >> 11) / 2^53, and n_k = round(1 / (1/n_lo − u_k · (1/n_lo − 1/n_hi))), the
# inverse CDF of the density ∝ 1/n² on [n_lo, n_hi] (equal expected work per octave), in doubles, rounded
# to the nearest integer, a tie to the even one (Python's round), then clamped to [n_lo, n_hi]. No value
# is within 0.009 of a tie, so any rounding rule gives this list (the test checks 1e-6 with exact
# rationals). Σ n = 32,060,318.
lengths = [
    202109, 151388, 556082, 207817, 394830, 542490, 355707, 348583, 331757, 353644,
    279314, 263002, 545955, 314021, 152163, 159823, 145404, 176242, 186633, 224157,
    174590, 287231, 165190, 164913, 197040, 150598, 167100, 136058, 292052, 236696,
    491493, 298824, 489211, 404649, 254274, 186064, 201614, 580522, 329791, 750780,
    149611, 146725, 986256, 684942, 195865, 270010, 202428, 324889, 501473, 260038,
    238449, 448940, 298915, 370193, 204450, 446253, 432030, 522345, 278618, 155263,
    158119, 237412, 442472, 284980, 162386, 210558, 148933, 641165, 980030, 791452,
    133460, 429685, 251011, 182656, 301491, 151149, 181150, 194910, 205798, 1011610,
    346439, 597766, 389391, 656622, 403982, 153100, 149058, 319683, 155616, 638315,
    237618, 218729, 328702, 662587, 377019, 150940, 206820,
]

[calibration]     # AGENTS.md §6: interleaved samples with no entry process alive, medians used
every = 8         # one sample before step 1 and every 8 steps after
idle_s = 2.0      # the idle gap before a sample (1 s left residual load)
rounds = 32       # the work of one `calib` run (harness/tools/calib.c)
runs_per_sample = 3     # a sample is the median of this many short runs
ref_ns = 316200000      # AGENTS.md §6: `calib`'s time (32 rounds, its Keccak workload, the job's 8
                        # threads) on the evaluation machine, the median of 30 samples; c_P =
                        # median(samples) / ref_ns is a health check, never in the score
ref_provisional = false # ref_ns is measured: c_P's drift is enforced
c_P_drift = 0.065       # AGENTS.md §6: |c_P - 1| above it is an organiser ERROR (the machine is not
                        # in its calibrated state); about 4 standard deviations of one c_P sample at
                        # the higher measured spread on the evaluation machine (1.55 %), far more of
                        # the median that is judged
triv_chains = 64        # the chain checker's instance: 64 chains of 2^18 steps (2^24 permutations)
triv_n = 262144
service_s = 2           # seconds per service throughput measurement (published, not scored)

[dos]             # on the stream's last output π_M
proofs = 100
item_factor = 10      # an input may take at most item_factor · v_ref (parse plus acc)
item_cap = "v_ref"    # "v_ref": item_factor · v_ref; "verify_s": the per-check cap (the smoke)
total_s = 180         # the whole column's budget; a breach is the entry's failure

[caps]            # no proof cap: |π| is priced by s_ref, and acc only requires it to fit a word
file_cap = 67108864     # a signed-proof file the runner reads: ≤ 64 MiB
verify_s = 10           # one acc check
setup_s = 240           # `prover setup` (untimed)
setup_cap = 4294967296  # the setup directory after `prover setup`: ≤ 4 GiB
work_cap = 4294967296   # a request's /work when its prover is dead: ≤ 4 GiB, sparse files at their size
build_s = 120           # the prover's build

[memory]          # cgroup caps (13 GB for prover and service together)
prover = "11G"
service = "2G"
badge = "4G"

[machine]         # AGENTS.md §6: a benchmark on another machine (or with no readable fingerprint)
                  # is an organiser ERROR. The sha256 of the canonical JSON (sort_keys, separators
                  # "," ":") of the required fields cpu_model, vm_shape {vcpus, memory},
                  # frequency_policy, image_id of the file at RF_MACHINE_FINGERPRINT that the
                  # evaluation VM provides (rfh.bench.fingerprint); only the hash is published
                  # (host_kernel is recorded, not hashed; microcode is not published)
fingerprint = "d28ff4798f3900a304361e62239bd35575a8b73920dcdb03d97079bde2599927"   # the bench VM on image 9339a3c3…; a new image changes it
