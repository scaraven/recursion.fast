# recursion.fast v4: the CI smoke shape (r = 2, n = 16, M = 4; BRIEF V4-11). Same keys as season.toml.
name = "smoke"
K = 20.0          # score weight of the link time: S = T_tree + K * t_link (V4-10, provisional)
R = 10            # T_V = T_triv,best / R (V4-12, CM-8)

[certificate]     # the certificate job's Lean steps (V4-A9), as in the season
build_s = 600
kernel_s = 600
gate_s = 120
badge_s = 180

[tree]            # the T run (V4-11): 2^r leaves of chain length n; one run, only its root is read
r = 2
n = 16
tree_s = 120

[stream]          # the recursion term (cost model §3.3); one run
M = 4
n_f = 16
step_s = 60
stream_s = 300
check_every = 2   # outputs checked in batches of this many (all before the service exits)

[canaries]        # statement canaries (C15) on the root and the first per_kind stream leaves and nodes
per_kind = 2

[dos]
proofs = 64
item_factor = 10     # an input may take at most item_factor · T_V (verify_s where T_V is not enforced)
total_s = 180        # the whole column's budget; a breach is the entry's failure (RF-M1)

[caps]
proof_cap = 1048576     # |π| ≤ 2^20 (checked by acc; V4-13)
file_cap = 67108864     # a signed-proof file the runner reads: ≤ 64 MiB
verify_s = 10           # one acc check
setup_s = 300
build_s = 300

[memory]          # cgroup caps (13 GB for prover and service together, V4-13)
prover = "11G"
service = "2G"
badge = "4G"

[tv]
enforce = false   # T_V is meaningless at n = 16 (the trivial check is microseconds); reported only
checker_runs = 2              # T_triv,best is the best of these chain-checker runs
service_calibration_s = 1     # seconds per service throughput measurement (V4-A5)
