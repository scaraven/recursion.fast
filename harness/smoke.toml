# recursion.fast: the CI smoke shape (a short stream of 4 steps, one leaf of 6 blocks each). Same
# keys as season.toml: the season's size caps and score, its own verifier and time caps.
name = "smoke"

[score]           # as the season's: S = P_total · |π_M|, S_every = P_total · max_i |π_i| (no parameter)

[certificate]     # the certificate job's Lean steps, as in the season but build_s (the season's 1200)
build_s = 600
kernel_s = 600
gate_s = 120
badge_s = 180
render_s = 30     # the challenge rendered from claim.json (≤ claim_bytes)
source_rule_s = 120   # the source rule on lean/ (≤ lean_bytes; 8.9 MB took 10 s on an organiser
                      # workstation)

[entry]           # the entry root as data, checked before the source rule (so a huge unused file
                  # cannot force a timeout); a breach is the entry's REJECT. A large recursive
                  # entry measured: lean/ 263 files, 8.9 MB, largest 145 kB; prover/ 44 files,
                  # 58.6 MB, prover.s 35.1 MB; the whole root 67.5 MB
files = 2048              # every regular file of the root
bytes = 536870912         # 512 MiB, the whole root
file_bytes = 134217728    # 128 MiB, any one file
lean_files = 1024         # lean/ (all files, any depth)
lean_bytes = 33554432     # 32 MiB: the source rule's input (8.9 MB took 10 s on an organiser
                          # workstation)
prover_files = 256        # prover/
prover_bytes = 268435456  # 256 MiB
claim_bytes = 65536       # claim.json, the renderer's input

[stream]
M = 4
n = 6             # the smoke's leaves: 6 blocks per step (levels 6 → 3 → 2 → 1, an odd one carried up;
                  # 11 permutations per leaf)
ready_s = 10
step_s = 60
stream_s = 300
check_every = 2
timed_runs = 3    # as the season's
scrub_batches = 256   # AN EXCEPTION (the season's 4096): CI's smoke runs about 40 timed requests, which
                  # at 4096 would take about 10 s more each and overrun its time limits; the mechanism
                  # is the same, only the noise is smaller
runner_budget_s = 300   # the smoke's: its honest stream's runner overhead is about 20 s

[calibration]
every = 4
idle_s = 0.2
rounds = 2
runs_per_sample = 3
ref_ns = 50000000
ref_provisional = true   # the smoke runs on any machine: c_P's drift is recorded, never enforced
c_P_drift = 0.05
service_s = 1

[caps]            # the season's size caps; its own verifier cap (below)
pi_cap = 1048576
final_pi_cap = 524288
badge_start_s = 10 # as the season's 2 s; 10 s for the Python stand-in badge of `--mock`,
                  # which compiles its C Keccak-256 reference on its first check
v_cap_ms = 128    # AN EXCEPTION to the season's caps (64 ms there; badge_start_s and build_s are the others): the toy's
                  # witness-sending V grows with the stream's history (each node checks its children
                  # again), its final V about 51–64 ms with the compiled badge on an organiser
                  # workstation, and CI runs the smoke on shared runners, where a 64 ms cap would make
                  # the ACCEPT checks flaky. The cap's REJECT is checked at 8 ms (tests/harness/smoke.py)
file_cap = 67108864
setup_s = 240
setup_cap = 4294967296
work_cap = 4294967296
build_s = 120

[memory]
prover = "8G"
service = "2G"
badge = "4G"

[machine]
fingerprint = "any"   # the smoke accepts any machine
