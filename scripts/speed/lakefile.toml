# Speed probe of the badge path (not a default target, not trusted). Run from the repository root:
#   lake -f scripts/speed/lakefile.toml build speed && .lake/build/bin/speed
# It is the main lakefile's library plus one executable, kept in its own configuration file so
# that the repository's lakefile is unchanged (stage A may adjust only its [[lean_lib]] blocks).
name = "RecursionFast"
defaultTargets = ["speed"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "572f997390aa4fc131ef30b1186fa1dcf292ca10"

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "7653a901ed466c88a2e61a3075011b73d7bb2316"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "a4232d084aa18aa71f75b92b64082b457ffdb77b"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "41d3b21dcc99817fe4f9f24ca7b2b58f0578083d"

[[lean_lib]]
name = "RecursionFast"
roots = ["RecursionFast"]

[[lean_exe]]
name = "speed"
srcDir = "scripts/speed"
root = "Speed"

[[lean_exe]]
name = "signer"
srcDir = "scripts/speed"
root = "Signer"
