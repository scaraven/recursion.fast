replacement = '''(V x.1 x.2).runLog [] = some true ∧'''
breaks = "the adversary's win reads the verifier's verdict on the empty log"
expect = "Controls.Security.queryThenAccept_ks_ge_one"

[[mutant]]
id = "sec-complete-b-true"
