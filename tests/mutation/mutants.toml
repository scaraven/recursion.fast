[[mutant]]
id = "keccak-out-31"
file = "Hash/Keccak.lean"
original = '''(w >>> (8 * k).toUInt64).toUInt8).take 32'''
replacement = '''(w >>> (8 * k).toUInt64).toUInt8).take 31'''
breaks = "the output is 31 bytes"
expect = "INVALID: keccakDigest's length proof (Relation.lean)"

[[mutant]]
id = "keccak-chi-mirrored"
file = "Hash/Keccak.lean"
original = '''lane a x y ^^^ (~~~lane a (x + 1) y &&& lane a (x + 2) y)'''
replacement = '''lane a x y ^^^ (lane a (x + 1) y &&& ~~~lane a (x + 2) y)'''
breaks = "chi negates the wrong neighbour"
expect = "Controls.Keccak.chi_unit"

[[mutant]]
id = "keccak-theta-swapped"
file = "Hash/Keccak.lean"
original = '''c (x + 4) ^^^ rotl (c (x + 1)) 1'''
replacement = '''c (x + 1) ^^^ rotl (c (x + 4)) 1'''
breaks = "theta's neighbouring columns are swapped"
expect = "Controls.Keccak.theta_unit"

[[mutant]]
id = "keccak-23-rounds"
file = "Hash/Keccak.lean"
original = '''def keccakF (a : State) : State := rc.foldl round a'''
replacement = '''def keccakF (a : State) : State := (rc.toList.take 23).foldl round a'''
breaks = "the permutation has 23 rounds"
expect = "Controls.Keccak.keccakF_zero_kat"

[[mutant]]
id = "keccak-blocklane-xor"
file = "Hash/Keccak.lean"
original = '''(fun w k => w ||| (blk.getD (8 * i + k) 0).toUInt64 <<< (8 * k).toUInt64) 0'''
replacement = '''(fun w k => w ^^^ (blk.getD (8 * i + k) 0).toUInt64 <<< (8 * k).toUInt64) 0'''
breaks = "nothing: the eight shifted bytes are disjoint, so OR and XOR agree"
expect = "survives (equivalent), unless a proof depends on the form"
calibrate = "survive"
equivalent = true

# ---------------------------------------------------------------- Extractor.lean

[[mutant]]
id = "ext-tag-swap"
file = "Extractor.lean"
original = '''  | 0 => return .leaf (← readDigest) (← readNat)
  | 1 => return .node'''
replacement = '''  | 1 => return .leaf (← readDigest) (← readNat)
  | 0 => return .node'''
breaks = "the output's tags 0 and 1 are swapped"
expect = "Controls.Extractor.decodeWit_leaf_kat"

[[mutant]]
id = "ext-readbytes-lenient"
file = "Extractor.lean"
original = '''  if ws.length = (n + 7) / 8 then some ((ws.flatMap wordBytes).take n, o.drop ((n + 7) / 8))
  else none'''
replacement = '''  some ((ws.flatMap wordBytes).take n, o.drop ((n + 7) / 8))'''
breaks = "a byte field that runs past the end decodes (not strict)"
expect = "Controls.Extractor.decodeWit_long_proof"

[[mutant]]
id = "ext-logwords-no-count"
file = "Extractor.lean"
original = '''toWord L.length :: L.flatMap'''
replacement = '''L.flatMap'''
breaks = "the log on the tape carries no entry count"
expect = "Controls.Extractor.extractorInput_kat"

[[mutant]]
id = "ext-pack-big-endian"
file = "Extractor.lean"
original = '''ds.foldr (fun d a => d.toNat + 256 * a) 0'''
replacement = '''ds.foldl (fun a d => d.toNat + 256 * a) 0'''
breaks = "bytes are packed big-endian"
expect = "Controls.Extractor.extractorInput_kat"

[[mutant]]
id = "ext-readsig-counts-swapped"
file = "Extractor.lean"
original = '''readList readDigest wotsLen, ← readList readDigest sigHeight'''
replacement = '''readList readDigest sigHeight, ← readList readDigest wotsLen'''
breaks = "the signature's chain values and path are read with each other's counts"
expect = "Controls.Extractor.decodeWit_node_kat"

[[mutant]]
id = "ext-budget-2^17"
file = "Extractor.lean"
original = '''def extractorBudget (t : ℕ) : ℕ := 2 ^ 48 + 2 ^ 16 * t'''
replacement = '''def extractorBudget (t : ℕ) : ℕ := 2 ^ 48 + 2 ^ 17 * t'''
breaks = "the budget charges 2^17 steps per input word"
expect = "Controls.Certificate.fuel_over_budget_per_word_claim (added after this mutant survived)"
calibrate = "survive"

[[mutant]]
id = "ext-outcap-2^25"
file = "Extractor.lean"
original = '''def outCap : ℕ := 2 ^ 24'''
replacement = '''def outCap : ℕ := 2 ^ 25'''
breaks = "the output cap is 2^25 words, so the proof domain 256 MiB"
expect = "Controls.Extractor.toolong_not_computes (2^24 + 1 output words)"
calibrate = "survive"

[[mutant]]
id = "ext-computes-small-domain"
file = "Extractor.lean"
original = '''π.size ≤ 8 * outCap →'''
replacement = '''π.size ≤ outCap →'''
breaks = "efficient extraction is asked only for proofs of at most 16 MiB"
expect = "Controls.Extractor.halt_not_big (added after this mutant survived)"

[[mutant]]
id = "ext-computes-no-outcap"
file = "Extractor.lean"
original = '''o.length ≤ outCap ∧ decodeWit o = E c π L'''
replacement = '''decodeWit o = E c π L'''
breaks = "the extractor's output is not capped"
expect = "Controls.Extractor.toolong_not_computes"

# ---------------------------------------------------------------- Machine.lean

[[mutant]]
id = "mach-sub-reversed"
file = "Machine.lean"
original = '''| .sub, a, b => a - b'''
replacement = '''| .sub, a, b => b - a'''
breaks = "sub computes b - a"
expect = "Controls.Machine.eval_kat"

[[mutant]]
id = "mach-remu-zero"
file = "Machine.lean"
original = '''| .remu, a, b => a % b'''
replacement = '''| .remu, a, b => if b = 0 then 0 else a % b'''
breaks = "x % 0 is 0, not x"
expect = "Controls.Machine.eval_kat"

[[mutant]]
id = "mach-shl-unmasked"
file = "Machine.lean"
original = '''| .shl, a, b => a <<< (b.toNat % 64)'''
replacement = '''| .shl, a, b => a <<< b.toNat'''
breaks = "shl shifts by the whole word, not its low 6 bits"
expect = "Controls.Machine.eval_kat"

[[mutant]]
id = "mach-clmulh-63"
file = "Machine.lean"
original = '''(RecursionFast.clmul a b >>> 64).setWidth 64'''
replacement = '''(RecursionFast.clmul a b >>> 63).setWidth 64'''
breaks = "clmulh returns the wrong window of the carry-less product"
expect = "Controls.Machine.eval_kat"

[[mutant]]
id = "mach-ite-swapped"
file = "Machine.lean"
original = '''(if M.getD c 0 = 0 then q else p)'''
replacement = '''(if M.getD c 0 = 0 then p else q)'''
breaks = "ite runs p when the cell is zero"
expect = "Controls.Extractor.ws_computes (the witness-sending program branches)"

[[mutant]]
id = "mach-mem-free"
file = "Machine.lean"
original = '''XStmt.exec input.toArray (fuel - p.memFor input.length)'''
replacement = '''XStmt.exec input.toArray fuel'''
breaks = "memory is not charged"
expect = "Controls.Machine.mem_charged / straight_short"

[[mutant]]
id = "mach-output-reversed"
file = "Machine.lean"
original = '''| _, _, o, [] => some o.toList'''
replacement = '''| _, _, o, [] => some o.toList.reverse'''
breaks = "the output words come out in reverse order"
expect = "Controls.Machine.straight_run"

[[mutant]]
id = "mach-loop-size-free"
file = "Machine.lean"
original = '''| .loop _ p => p.size + 1'''
replacement = '''| .loop _ p => p.size'''
breaks = "a loop statement does not count toward the program size cap"
expect = "Controls.Machine.size_kat (added after this mutant survived)"
calibrate = "survive"

[[mutant]]
id = "mach-loop-no-fuel"
file = "Machine.lean"
original = '''    | .loop c p => exec I n M o (if M.getD c 0 = 0 then ks else p :: .loop c p :: ks)'''
replacement = '''    | .loop c p => exec I (n + 1) M o (if M.getD c 0 = 0 then ks else p :: .loop c p :: ks)'''
breaks = "a loop iteration consumes no fuel"
expect = "INVALID: the structural recursion on fuel no longer terminates"

