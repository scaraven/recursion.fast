[[mutant]]
id = "mach-input-past-end-one"
file = "Machine.lean"
original = '''| .input d a => exec I n (M.setIfInBounds d (I.getD (M.getD a 0).toNat 0)) o ks'''
replacement = '''| .input d a => exec I n (M.setIfInBounds d (I.getD (M.getD a 0).toNat 1)) o ks'''
breaks = "an input read past the tape's end is 1, not 0"
