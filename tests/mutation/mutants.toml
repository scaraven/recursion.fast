[[mutant]]
id = "mach-load-address"
file = "Machine.lean"
original = '''| .load d a => exec I n (M.setIfInBounds d (M.getD (M.getD a 0).toNat 0)) o ks'''
replacement = '''| .load d a => exec I n (M.setIfInBounds d (M.getD a 0)) o ks'''
