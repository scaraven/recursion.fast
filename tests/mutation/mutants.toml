# Mutants of the trusted contract (RecursionFast/Contract/**/*.lean), for tests/mutation/run.py.
#
# Each mutant replaces `original` (which must occur exactly once in `file`, relative to
# RecursionFast/Contract/) by `replacement`, in a scratch copy of the repository only; the committed
# contract is never changed. `breaks` is the property the mutation breaks, `expect` the check
# expected to kill it. `calibrate = "survive"` marks a mutant expected to survive (an equivalent
# mutation, or a constant no check pins), so that a run also shows what the checks do not see;
# `equivalent = true` marks one that does not change the meaning on any input.

# ---------------------------------------------------------------- Relation.lean

[[mutant]]
id = "rel-no-leafcap"
file = "Relation.lean"
original = '''| c, .leaf s n => n ≤ leafCap ∧ c = leafStmt (leafValue s n) n'''
replacement = '''| c, .leaf s n => c = leafStmt (leafValue s n) n'''
breaks = "a leaf witness of any size is in the relation (no leafCap bound)"
expect = "Controls.Relation.leaf_over_leafCap"

[[mutant]]
id = "rel-leafcap-2^23"
file = "Relation.lean"
original = '''def leafCap : ℕ := 2 ^ 22'''
replacement = '''def leafCap : ℕ := 2 ^ 23'''
breaks = "the leaf bound is 2^23, not the season's 2^22"
expect = "Controls.Relation.leaf_over_season (added after this mutant survived an earlier version)"
calibrate = "survive"

[[mutant]]
id = "rel-querycap-2^21"
file = "Relation.lean"
original = '''def queryCap : ℕ := 2 ^ 20'''
replacement = '''def queryCap : ℕ := 2 ^ 21'''
breaks = "acc accepts queries of up to 2^21 bytes, above the service's 2^20 cap"
expect = "Controls.Relation.acc_query_over_2pow20 (added after this mutant survived)"
calibrate = "survive"

[[mutant]]
id = "rel-nodestmt-swap"
file = "Relation.lean"
original = '''keccakDigest (tagNode :: c₁.toList ++ c₂.toList)'''
replacement = '''keccakDigest (tagNode :: c₂.toList ++ c₁.toList)'''
breaks = "the node layout hashes the children in the wrong order"
expect = "Controls.Relation.nodeStmt_kat"

[[mutant]]
id = "rel-tagitem-eq-tagleaf"
file = "Relation.lean"
original = '''def tagItem : UInt8 := 0x48'''
replacement = '''def tagItem : UInt8 := 0x4C'''
breaks = "leaf items and leaf statements share a domain tag"
expect = "Controls.Relation.tags_separate / item0_kat"

[[mutant]]
id = "rel-enc64-big-endian"
file = "Relation.lean"
original = '''List.ofFn fun i : Fin 8 => (n / 256 ^ i.val).toUInt8'''
replacement = '''List.ofFn fun i : Fin 8 => (n / 256 ^ (7 - i.val)).toUInt8'''
breaks = "enc64 is big-endian, not Rust's u64::to_le_bytes"
expect = "Controls.Relation.item1_kat"

[[mutant]]
id = "rel-leafvalue-shift"
file = "Relation.lean"
original = '''| n + 1 => digestXor (leafValue s n) (leafItem s n)'''
replacement = '''| n + 1 => digestXor (leafValue s n) (leafItem s (n + 1))'''
breaks = "the leaf value XORs items 1 … n, dropping item 0 and adding item n"
expect = "Controls.Relation.value2_kat"

[[mutant]]
id = "rel-leafvalue-nonzero-start"
file = "Relation.lean"
original = '''  | 0 => Vector.replicate 32 0
  | n + 1 => digestXor'''
replacement = '''  | 0 => Vector.replicate 32 1
  | n + 1 => digestXor'''
breaks = "the leaf value starts from a nonzero digest"
expect = "Controls.Relation.value2_kat"

[[mutant]]
id = "rel-xor-or"
file = "Relation.lean"
original = '''Vector.zipWith (· ^^^ ·) a b'''
replacement = '''Vector.zipWith (· ||| ·) a b'''
breaks = "the leaf value combines items by OR, not XOR"
expect = "Controls.Relation.value2_kat"

[[mutant]]
id = "rel-leafstmt-no-count"
file = "Relation.lean"
original = '''keccakDigest (tagLeaf :: h.toList ++ enc64 n)'''
replacement = '''keccakDigest (tagLeaf :: h.toList)'''
breaks = "the leaf statement does not commit to the number of hashes"
expect = "Controls.Relation.leafStmt_kat"

[[mutant]]
id = "rel-node-drop-acc2"
file = "Relation.lean"
original = '''c = nodeStmt c₁ c₂ ∧ acc c₁ p₁ = true ∧ acc c₂ p₂ = true'''
replacement = '''c = nodeStmt c₁ c₂ ∧ acc c₁ p₁ = true'''
breaks = "a node's second child is not checked"
expect = "Controls.Relation.second_child_rejected"

[[mutant]]
id = "rel-node-acc2-wrong-child"
file = "Relation.lean"
original = '''acc c₁ p₁ = true ∧ acc c₂ p₂ = true'''
replacement = '''acc c₁ p₁ = true ∧ acc c₁ p₂ = true'''
breaks = "a node's second proof is checked against the first child's digest"
expect = "Controls.Relation.node_of_two_leaves / second_child_rejected"

[[mutant]]
id = "rel-docstring-only"
file = "Relation.lean"
original = '''/-- The most hashes a leaf statement may cover: `2^22`. -/'''
replacement = '''/-- The most hashes a leaf statement may cover (a mutated docstring). -/'''
breaks = "nothing: only a docstring changes"
expect = "survives (equivalent)"
calibrate = "survive"
equivalent = true

# ---------------------------------------------------------------- Tree.lean

[[mutant]]
id = "tree-stream-args-swapped"
file = "Tree.lean"
original = '''hs.foldl (fun c h => nodeStmt c (leafStmt h n)) (leafStmt h n)'''
replacement = '''hs.foldl (fun c h => nodeStmt (leafStmt h n) c) (leafStmt h n)'''
breaks = "the stream step hashes the new leaf before the previous statement"
expect = "Controls.Tree.streamStmt_three / streamStmt_kat"

[[mutant]]
id = "tree-stream-reversed"
file = "Tree.lean"
original = '''| h :: hs => hs.foldl'''
replacement = '''| h :: hs => hs.reverse.foldl'''
breaks = "the stream folds its later leaves newest first"
expect = "Controls.Tree.streamStmt_kat"

[[mutant]]
id = "tree-level-swap"
file = "Tree.lean"
original = '''| c₁ :: c₂ :: cs => nodeStmt c₁ c₂ :: treeLevel cs'''
replacement = '''| c₁ :: c₂ :: cs => nodeStmt c₂ c₁ :: treeLevel cs'''
breaks = "the tree pairs adjacent digests right to left"
expect = "Controls.Tree.treeRoot_two"

[[mutant]]
id = "tree-root-half-levels"
file = "Tree.lean"
original = '''(treeLevel^[cs.length] cs).headD'''
replacement = '''(treeLevel^[cs.length / 2] cs).headD'''
breaks = "the root iterates |cs|/2 levels: equal on powers of two, wrong on 3 leaves"
expect = "Controls.Tree.treeRoot_three"

# ---------------------------------------------------------------- Oracle.lean

[[mutant]]
id = "oracle-runseq-leftover"
file = "Oracle.lean"
original = '''| _ :: _, ret _ => none'''
replacement = '''| _ :: _, ret a => some a'''
breaks = "runSeq accepts a trace with entries left over (no exact consumption)"
expect = "Controls.Oracle.prog_runSeq_extra / Controls.Relation.child_trace_nonempty"

[[mutant]]
id = "oracle-runseq-no-query-check"
file = "Oracle.lean"
original = '''| (q', a) :: tr, query q k => if q' = q then runSeq tr (k a) else none'''
replacement = '''| (_, a) :: tr, query _ k => runSeq tr (k a)'''
breaks = "runSeq answers a query by an entry for another query"
expect = "Controls.Oracle.prog_runSeq_wrong_query"

[[mutant]]
id = "oracle-runlog-last-entry"
file = "Oracle.lean"
original = '''(L.find? fun e => e.1 = q).bind'''
replacement = '''(L.reverse.find? fun e => e.1 = q).bind'''
breaks = "runLog reads the last entry for a query, not the first (prob's table reads the first)"
expect = "Controls.Oracle.prog_runLog_first"

[[mutant]]
id = "oracle-queries-drop-head"
file = "Oracle.lean"
original = '''| query q k => q :: (k (H q)).queries H'''
replacement = '''| query q k => (k (H q)).queries H'''
breaks = "queries omits each query asked, so qV and Q bound nothing"
expect = "Controls.Oracle.prog_queries / Controls.Security.queryThenAccept_ks_ge_one"

[[mutant]]
id = "oracle-bind-ignores-answer"
file = "Oracle.lean"
original = '''| query q k, f => query q fun d => (k d).bind f'''
replacement = '''| query q k, f => query q fun _ => (k (Vector.replicate 32 0)).bind f'''
breaks = "bind feeds the zero digest to the program instead of the oracle's answer"
expect = "Library proofs (completeness, KS bridge)"

