replacement = '''prob (fun b _ => b = true) ((P c w).bind (V c)) [] ≤ δ'''
breaks = "completeness bounds the probability of acceptance, not of rejection"
expect = "Controls.Security.ws_complete / rejectAll_not_complete"

[[mutant]]
id = "sec-prob-not-recorded"
file = "Security.lean"
original = '''∑ a : Digest, prob B (k a) (L ++ [(q, a)])'''
replacement = '''∑ a : Digest, prob B (k a) L'''
breaks = "a fresh answer is not recorded: a repeated query is re-sampled (no function)"
expect = "Library prob lemmas"

[[mutant]]
